[package]
name = "aoc-harness"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "templates/**", "Cargo.toml", "README.md", "LICENSE-*"]
description = "Ownership-aware Advent of Code execution and automatic benchmarks"

[dependencies]
aoc-harness-macros = { version = "0.2.1", path = "../aoc-harness-macros" }
clap.workspace = true
regex = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "plotters", "html_reports"] }
serde_json.workspace = true
tempfile = "3"
