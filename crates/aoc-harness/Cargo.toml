[package]
name = "aoc-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ownership-aware Advent of Code execution and automatic benchmarks"

[dependencies]
aoc-harness-macros = { version = "0.1.0", path = "../aoc-harness-macros" }
clap.workspace = true
regex = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "plotters", "html_reports"] }
